name: GHCR Build and EKS Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: axisstudio
  K8S_NAMESPACE: axisstudio
  K8S_DEPLOYMENT: axisstudio-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image coordinates
        id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "repository=ghcr.io/${owner}/${APP_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.repository }}:latest

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME || vars.EKS_CLUSTER_NAME }}
      EKS_KUBECTL_ROLE_ARN: ${{ secrets.EKS_KUBECTL_ROLE_ARN || vars.EKS_KUBECTL_ROLE_ARN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Validate EKS deploy secrets
        shell: bash
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID || vars.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID || vars.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || vars.NEXTAUTH_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL || vars.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || vars.OLLAMA_MODEL }}
        run: |
          missing=()

          for key in \
            AWS_REGION \
            EKS_CLUSTER_NAME \
            AUTH_SECRET \
            AUTH_GOOGLE_ID \
            AUTH_GOOGLE_SECRET \
            AUTH_GITHUB_ID \
            AUTH_GITHUB_SECRET \
            NEXTAUTH_URL \
            POSTGRES_URL \
            OLLAMA_BASE_URL \
            OLLAMA_MODEL
          do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ -z "$AWS_ROLE_TO_ASSUME" ] && { [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; }; then
            missing+=("AWS_ROLE_TO_ASSUME or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub Actions configuration: ${missing[*]}"
            echo "These names resolved empty in the workflow context."
            echo "Store sensitive values in Actions Secrets."
            echo "Non-sensitive values such as EKS_CLUSTER_NAME, AUTH_GOOGLE_ID, AUTH_GITHUB_ID, NEXTAUTH_URL, OLLAMA_BASE_URL, and OLLAMA_MODEL can also come from Actions Variables."
            echo "If you are using environment-scoped values, make sure they are attached to the exact GitHub environment name: Production."
            exit 1
          fi

      - name: Select AWS authentication method
        id: deploy-auth
        shell: bash
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "method=keys" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$AWS_ROLE_TO_ASSUME" ]; then
            if [[ ! "$AWS_ROLE_TO_ASSUME" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]]; then
              echo "AWS_ROLE_TO_ASSUME must be a full IAM role ARN like arn:aws:iam::123456789012:role/role-name"
              exit 1
            fi

            echo "method=oidc" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "No AWS authentication method configured."
          exit 1

      - name: Configure AWS credentials via OIDC
        if: ${{ steps.deploy-auth.outputs.method == 'oidc' }}
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Configure AWS credentials via access keys
        if: ${{ steps.deploy-auth.outputs.method == 'keys' }}
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}

      - name: Update kubeconfig for EKS
        shell: bash
        run: |
          if [ -n "$EKS_KUBECTL_ROLE_ARN" ]; then
            aws eks update-kubeconfig \
              --name "$EKS_CLUSTER_NAME" \
              --region "$AWS_REGION" \
              --role-arn "$EKS_KUBECTL_ROLE_ARN"
          else
            aws eks update-kubeconfig \
              --name "$EKS_CLUSTER_NAME" \
              --region "$AWS_REGION"
          fi

      - name: Create namespace and application secret
        shell: bash
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID || vars.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID || vars.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || vars.NEXTAUTH_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL || vars.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || vars.OLLAMA_MODEL }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl create namespace "${K8S_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

          secret_args=(
            --from-literal=AUTH_SECRET="$AUTH_SECRET"
            --from-literal=AUTH_GOOGLE_ID="$AUTH_GOOGLE_ID"
            --from-literal=AUTH_GOOGLE_SECRET="$AUTH_GOOGLE_SECRET"
            --from-literal=AUTH_GITHUB_ID="$AUTH_GITHUB_ID"
            --from-literal=AUTH_GITHUB_SECRET="$AUTH_GITHUB_SECRET"
            --from-literal=NEXTAUTH_URL="$NEXTAUTH_URL"
            --from-literal=POSTGRES_URL="$POSTGRES_URL"
            --from-literal=OLLAMA_BASE_URL="$OLLAMA_BASE_URL"
            --from-literal=OLLAMA_MODEL="$OLLAMA_MODEL"
          )

          if [ -n "$OLLAMA_API_KEY" ]; then
            secret_args+=(--from-literal=OLLAMA_API_KEY="$OLLAMA_API_KEY")
          fi

          kubectl create secret generic axisstudio-env \
            --namespace "${K8S_NAMESPACE}" \
            "${secret_args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

          if [ -n "$GHCR_PULL_USERNAME" ] && [ -n "$GHCR_PULL_TOKEN" ]; then
            kubectl create secret docker-registry ghcr-pull-secret \
              --namespace "${K8S_NAMESPACE}" \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_PULL_USERNAME" \
              --docker-password="$GHCR_PULL_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "GHCR pull credentials not provided. Make sure the GHCR package is public, or add GHCR_PULL_USERNAME and GHCR_PULL_TOKEN secrets."
          fi

      - name: Render AWS EKS overlay
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ needs.build.outputs.image_repository }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
        run: |
          cd k8s/overlays/aws-eks
          kustomize edit set image axisstudio="${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Apply Kubernetes manifests
        run: kubectl apply -k k8s/overlays/aws-eks

      - name: Attach GHCR pull secret to deployment
        shell: bash
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "$GHCR_PULL_USERNAME" ] || [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "Skipping GHCR imagePullSecrets patch because GHCR pull credentials are not configured."
            exit 0
          fi

          kubectl patch deployment "${K8S_DEPLOYMENT}" \
            --namespace "${K8S_NAMESPACE}" \
            --type merge \
            --patch '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ghcr-pull-secret"}]}}}}'

      - name: Wait for rollout
        run: kubectl rollout status deployment/"${K8S_DEPLOYMENT}" --namespace "${K8S_NAMESPACE}" --timeout=300s

      - name: Show service endpoint
        shell: bash
        run: |
          kubectl get service "${K8S_DEPLOYMENT}" \
            --namespace "${K8S_NAMESPACE}" \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}{"\n"}'
