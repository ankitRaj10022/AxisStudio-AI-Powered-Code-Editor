apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axisstudio-web
  namespace: axisstudio
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: axisstudio.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: axisstudio-web
                port:
                  number: 80
