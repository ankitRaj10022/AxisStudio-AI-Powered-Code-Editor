name: Docker Build and Kubernetes Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: axisstudio
  K8S_NAMESPACE: axisstudio
  K8S_DEPLOYMENT: axisstudio-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve image coordinates
        id: image
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "repository=ghcr.io/${owner}/axisstudio" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.repository }}:latest

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Validate required deploy secrets
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          K8S_INGRESS_HOST: ${{ secrets.K8S_INGRESS_HOST }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
        run: |
          missing=()
          for key in \
            KUBE_CONFIG \
            K8S_INGRESS_HOST \
            AUTH_SECRET \
            AUTH_GOOGLE_ID \
            AUTH_GOOGLE_SECRET \
            AUTH_GITHUB_ID \
            AUTH_GITHUB_SECRET \
            NEXTAUTH_URL \
            POSTGRES_URL \
            OLLAMA_BASE_URL \
            OLLAMA_MODEL
          do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub secrets: ${missing[*]}"
            exit 1
          fi

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf "%s" "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Create namespace and application secret
        shell: bash
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_GITHUB_ID: ${{ secrets.AUTH_GITHUB_ID }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          kubectl create namespace "${K8S_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

          secret_args=(
            --from-literal=AUTH_SECRET="$AUTH_SECRET"
            --from-literal=AUTH_GOOGLE_ID="$AUTH_GOOGLE_ID"
            --from-literal=AUTH_GOOGLE_SECRET="$AUTH_GOOGLE_SECRET"
            --from-literal=AUTH_GITHUB_ID="$AUTH_GITHUB_ID"
            --from-literal=AUTH_GITHUB_SECRET="$AUTH_GITHUB_SECRET"
            --from-literal=NEXTAUTH_URL="$NEXTAUTH_URL"
            --from-literal=POSTGRES_URL="$POSTGRES_URL"
            --from-literal=OLLAMA_BASE_URL="$OLLAMA_BASE_URL"
            --from-literal=OLLAMA_MODEL="$OLLAMA_MODEL"
          )

          if [ -n "$OLLAMA_API_KEY" ]; then
            secret_args+=(--from-literal=OLLAMA_API_KEY="$OLLAMA_API_KEY")
          fi

          kubectl create secret generic axisstudio-env \
            --namespace "${K8S_NAMESPACE}" \
            "${secret_args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Render production overlay
        shell: bash
        env:
          IMAGE_REPOSITORY: ${{ needs.build.outputs.image_repository }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          K8S_INGRESS_HOST: ${{ secrets.K8S_INGRESS_HOST }}
        run: |
          sed -i "s/axisstudio.example.com/${K8S_INGRESS_HOST}/g" k8s/overlays/production/ingress.yaml
          cd k8s/overlays/production
          kustomize edit set image axisstudio="${IMAGE_REPOSITORY}:${IMAGE_TAG}"

      - name: Apply Kubernetes manifests
        run: kubectl apply -k k8s/overlays/production

      - name: Create GHCR pull secret
        if: ${{ secrets.GHCR_PULL_USERNAME != '' && secrets.GHCR_PULL_TOKEN != '' }}
        shell: bash
        env:
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl create secret docker-registry ghcr-creds \
            --namespace "${K8S_NAMESPACE}" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_PULL_USERNAME" \
            --docker-password="$GHCR_PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl patch deployment "${K8S_DEPLOYMENT}" \
            --namespace "${K8S_NAMESPACE}" \
            --type merge \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ghcr-creds"}]}}}}'

      - name: Wait for rollout
        run: kubectl rollout status deployment/"${K8S_DEPLOYMENT}" --namespace "${K8S_NAMESPACE}" --timeout=300s
